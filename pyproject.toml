[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scansort"
version = "0.1.0"
description = "Local, privacy-friendly document intake: OCR scanned PDFs, propose a folder with a self-learning classifier and file them into Nextcloud after a one-click review."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marc Urben" }]
keywords = ["nextcloud", "ocr", "scanner", "paperless", "document-management", "webdav", "self-hosted"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Office/Business",
    "Environment :: Web Environment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.4",
    "httpx>=0.27",
    "pypdf>=4.3",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "dateparser>=1.4.3",
    "watchdog>=4.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[project.urls]
Homepage = "https://github.com/oxivanisher/scansort2nextcloud"
Issues = "https://github.com/oxivanisher/scansort2nextcloud/issues"

[project.optional-dependencies]
ocr = ["ocrmypdf>=16"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
scansort = "scansort.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scansort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]
