name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (amd64) for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: scansort:ci
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm scansort:ci scansort --version
          docker run --rm scansort:ci ocrmypdf --version
          docker run --rm scansort:ci tesseract --list-langs
          echo "smoke-test-password" | docker run --rm -i scansort:ci scansort hash-password --stdin | grep -q '^\$argon2id\$'
          HASH=$(echo "smoke-test-password" | docker run --rm -i scansort:ci scansort hash-password --stdin)
          docker run -d --name scansort-smoke -p 8080:8080 \
            -e SCANSORT_NEXTCLOUD__URL=http://127.0.0.1:9 -e SCANSORT_NEXTCLOUD__USER=bot \
            -e SCANSORT_WEBUI__PASSWORD_HASH="$HASH" scansort:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker logs scansort-smoke
          docker rm -f scansort-smoke
          # arbitrary non-root user (docker run --user / compose user:), fresh named volume
          docker run --rm --user 4321:4321 -v scansort-smoke-data:/data \
            -e SCANSORT_NEXTCLOUD__URL=http://127.0.0.1:9 -e SCANSORT_NEXTCLOUD__USER=bot \
            -e SCANSORT_WEBUI__PASSWORD_HASH="$HASH" scansort:ci scansort migrate
          docker run --rm --user 4321:4321 scansort:ci sh -c 'test "$HOME" = /tmp'
          docker volume rm scansort-smoke-data

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
