{% extends "base.html" %}
{% block title %}Log in · scansort{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<form method="post" action="/login" class="card login">
  <h1 class="login-brand"><img src="/static/logo.svg" alt="" width="40" height="40">scansort</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username <input name="username" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="primary">Log in</button>
</form>
{% endblock %}
