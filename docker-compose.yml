# Example deployment: an FTP server for the scanner + scansort.
# 1. cp config/config.example.yaml config/config.yaml   (and edit it)
# 2. cp .env.example .env                                (and fill in the secrets)
# 3. docker compose up -d
#
# Both containers use the stack user STACK_UID:STACK_GID from .env. The FTP server must start
# as root (vsftpd binds port 21 and creates its login user), but it writes the uploaded files
# as that UID/GID into an inbox owned by it and not group-writable, so scansort (which deletes
# the scans after processing) must run as the *same* UID.
services:
  ftp:
    image: delfer/alpine-ftp-server      # or any FTP server image
    restart: unless-stopped
    environment:
      # name|password|folder|uid|gid
      USERS: "scanner|${FTP_PASSWORD}|/home/scanner|${STACK_UID:-1000}|${STACK_GID:-1000}"
      ADDRESS: ${FTP_PUBLIC_ADDRESS:-}
    volumes:
      - ./inbox:/home/scanner
    ports:
      - "21:21"
      - "21000-21010:21000-21010"

  scansort:
    image: ghcr.io/oxivanisher/scansort2nextcloud:latest
    # build: .                           # or build locally
    restart: unless-stopped
    # Pick ONE way to set the user:
    #  a) PUID/PGID (below): starts as root, chowns ./data, then drops privileges
    #  b) user: never runs as root; chown ./data to STACK_UID:STACK_GID yourself first
    # user: "${STACK_UID:-1000}:${STACK_GID:-1000}"
    environment:
      PUID: ${STACK_UID:-1000}
      PGID: ${STACK_GID:-1000}
      TZ: Europe/Zurich
      SCANSORT_NEXTCLOUD__USER: ${NC_USER:?set NC_USER in .env}
      SCANSORT_NEXTCLOUD__PASSWORD: ${NC_APP_PASSWORD:?set NC_APP_PASSWORD in .env}
      SCANSORT_WEBUI__PASSWORD_HASH: ${WEBUI_PASSWORD_HASH}
      SCANSORT_WEBUI__SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - ./inbox:/data/inbox
    ports:
      - "8080:8080"
